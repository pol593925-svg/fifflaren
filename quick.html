<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Быстрое действие</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: #16181d; color: #e8eaed;
      border: 2px solid #2a323c; border-radius: 12px;
      display: flex; flex-direction: column;
    }
    .head {
      background: #20242b; padding: 10px 14px; border-radius: 10px 10px 0 0;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: bold; font-size: 15px; cursor: default; user-select: none;
    }
    .head button {
      background: #333; color: #fff; border: none; border-radius: 6px;
      width: 28px; height: 28px; font-size: 14px; cursor: pointer;
    }
    .content { flex: 1; overflow-y: auto; padding: 14px; }
    label { display: block; font-size: 11px; color: #9aa4b0; margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #3a4350;
      background: #0d0f12; color: #e8eaed; font-size: 14px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #0d6efd; }
    textarea { resize: none; min-height: 80px; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    .go {
      width: 100%; margin-top: 14px; padding: 12px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: bold; color: #fff; cursor: pointer;
    }
    .go-call { background: #dc3545; }
    .go-log { background: #0d6efd; }
    .go-leave { background: #198754; }
    .go-q { background: #fd7e14; }
    .go-tr { background: #6f42c1; }
    .go:disabled { opacity: 0.6; cursor: wait; }
    #result { margin-top: 10px; font-size: 14px; min-height: 20px; text-align: center; }
    .hint { font-size: 10px; color: #777; margin-top: 4px; }
    #trRes { background: #101820; }
    .photo-btn {
      width: 100%; margin-top: 8px; padding: 10px; border: 1px dashed #6f42c1; border-radius: 8px;
      background: transparent; color: #b39ddb; font-size: 13px; cursor: pointer;
    }
    input[type=file] { font-size: 11px; padding: 6px; }
  </style>
</head>
<body>
  <div class="head">
    <span id="title">Быстрое действие</span>
    <button onclick="closeMe()" title="Закрыть">✕</button>
  </div>
  <div class="content">

    <!-- КОЛ -->
    <div id="f-call" style="display:none;">
      <label>Что заколить *</label>
      <select id="callType">
        <option>Заколить на биржу</option>
        <option>Заколить на почту</option>
        <option>Скачать пасы</option>
        <option>Заколить на пин</option>
      </select>
      <label>Ссылка / пояснение</label>
      <input id="callLink" placeholder="Необязательно">
      <label>Комментарий</label>
      <input id="callNote" placeholder="Необязательно">
      <button class="go go-call" id="submitBtn">🆘 Заколить</button>
      <p class="hint">Улетит сразу Fifflarenу — в его графу питомца, с уведомлением и звуком.</p>
    </div>

    <!-- ЛОГ -->
    <div id="f-log" style="display:none;">
      <label>Ссылка на лог *</label>
      <input id="logLink" placeholder="https://admin.standard-margin.com/...">
      <label>Комментарий</label>
      <input id="logComment" placeholder="Необязательно">
      <button class="go go-log" id="submitBtn2">📝 Добавить лог</button>
      <p class="hint">Лог привяжется к твоей смене сегодняшнего дня.</p>
    </div>

    <!-- ОТПРОС -->
    <div id="f-leave" style="display:none;">
      <label>Причина</label>
      <select id="leaveReason">
        <option>Личные обстоятельства</option>
        <option>По здоровью</option>
        <option>Срочные дела</option>
        <option>Устал, нужен перерыв</option>
        <option>Другое</option>
      </select>
      <label>Комментарий</label>
      <input id="leaveComment" placeholder="Необязательно">
      <div class="row">
        <div>
          <label>Дата *</label>
          <input type="date" id="leaveDate">
        </div>
        <div>
          <label>С *</label>
          <input type="time" id="leaveFrom">
        </div>
        <div>
          <label>До *</label>
          <input type="time" id="leaveTo">
        </div>
      </div>
      <button class="go go-leave" id="submitBtn3">🏖 Отпроситься</button>
    </div>

    <!-- ВОПРОС ТИМУ -->
    <div id="f-question" style="display:none;">
      <label>Твой вопрос ТЛу *</label>
      <textarea id="qText" placeholder="Напиши вопрос — улетит твоему ТЛ с уведомлением..."></textarea>
      <button class="go go-q" id="submitBtn4">❓ Отправить ТЛу</button>
    </div>

    <!-- ПЕРЕВОДЧИК -->
    <div id="f-translator" style="display:none;">
      <label>Текст (любой язык)</label>
      <textarea id="trSrc" placeholder="Вставь текст на любом языке..."></textarea>
      <div class="row" style="margin-top:8px; align-items:center;">
        <select id="trTarget" style="flex:1;">
          <option value="ru" selected>🇷🇺 Русский</option>
          <option value="en">🇬🇧 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="it">🇮🇹 Italiano</option>
          <option value="tr">🇹🇷 Türkçe</option>
          <option value="pl">🇵🇱 Polski</option>
          <option value="uk">🇺🇦 Українська</option>
          <option value="zh">🇨🇳 中文</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="hi">🇮🇳 हिन्दी</option>
          <option value="ar">🇸🇦 العربية</option>
        </select>
        <button class="go go-tr" id="trBtn" style="width:130px; margin-top:0; padding:9px;">🌐 Перевести</button>
      </div>
      <label style="margin-top:12px;">Перевод</label>
      <textarea id="trRes" readonly placeholder="Здесь появится перевод..."></textarea>
      <button class="photo-btn" id="ocrBtn">📷 Или загрузи картинку — распознаю и переведу</button>
      <input type="file" id="ocrFile" accept="image/*" style="margin-top:6px; display:none;">
      <p class="hint" id="ocrHint">Автоопределение языка. Картинка: текст вырежется автоматически (OCR).</p>
    </div>

    <p id="result"></p>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'call';

    const TITLES = {
      call: '🆘 Кол',
      log: '📝 Добавить лог',
      leave: '🏖 Отпроситься',
      question: '❓ Вопрос тиму',
      translator: '🌐 Переводчик'
    };
    document.getElementById('title').textContent = TITLES[mode] || 'Действие';
    document.getElementById('f-' + mode).style.display = '';

    if (mode === 'leave') {
      document.getElementById('leaveDate').value = new Date().toISOString().slice(0, 10);
    }

    function closeMe() { ipcRenderer.send('close-quick'); }

    function showResult(ok, msg) {
      const el = document.getElementById('result');
      el.style.color = ok ? '#2ecc71' : '#e74c3c';
      el.textContent = msg;
      if (mode !== 'translator') setTimeout(closeMe, ok ? 1100 : 2500);
    }

    function submit(fields) {
      showResult(true, '⏳ Отправка...');
      ipcRenderer.send('quick-submit', { mode, fields });
    }

    ipcRenderer.on('quick-result', (e, r) => showResult(!!r.ok, r.message || ''));

    // --- формы ---
    if (mode === 'call') document.getElementById('submitBtn').onclick = () => {
      submit({
        callType: document.getElementById('callType').value,
        serviceName: '',
        callLink: document.getElementById('callLink').value.trim(),
        callNote: document.getElementById('callNote').value.trim()
      });
    };
    if (mode === 'log') document.getElementById('submitBtn2').onclick = () => {
      const link = document.getElementById('logLink').value.trim();
      if (!link) return showResult(false, 'Вставь ссылку на лог!');
      submit({ link, comment: document.getElementById('logComment').value.trim() });
    };
    if (mode === 'leave') document.getElementById('submitBtn3').onclick = () => {
      const date = document.getElementById('leaveDate').value;
      const from = document.getElementById('leaveFrom').value;
      const to = document.getElementById('leaveTo').value;
      if (!date || !from || !to) return showResult(false, 'Заполни дату и время!');
      const reason = document.getElementById('leaveReason').value;
      const comment = document.getElementById('leaveComment').value.trim();
      submit({ reason: comment ? reason + ' — ' + comment : reason, leaveDate: date, from, to });
    };
    if (mode === 'question') document.getElementById('submitBtn4').onclick = () => {
      const text = document.getElementById('qText').value.trim();
      if (!text) return showResult(false, 'Напиши вопрос!');
      submit({ text });
    };

    // --- переводчик ---
    async function translateText(text, tl) {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=' +
        encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(text.slice(0, 4500));
      const r = await fetch(url);
      const j = await r.json();
      return (j && j[0] ? j[0].map(x => x && x[0]).join('') : '').trim();
    }

    if (mode === 'translator') {
      document.getElementById('trBtn').onclick = async () => {
        const text = document.getElementById('trSrc').value.trim();
        if (!text) return showResult(false, 'Вставь текст!');
        const res = document.getElementById('trRes');
        const btn = document.getElementById('trBtn');
        btn.disabled = true; res.value = '⏳ Перевожу...';
        try {
          const out = await translateText(text, document.getElementById('trTarget').value);
          res.value = out || 'Не удалось перевести';
          showResult(true, '');
        } catch (e) {
          res.value = '';
          showResult(false, 'Ошибка перевода — проверь интернет');
        }
        btn.disabled = false;
      };

      const ocrBtn = document.getElementById('ocrBtn');
      const ocrFile = document.getElementById('ocrFile');
      ocrBtn.onclick = () => ocrFile.click();
      ocrFile.onchange = async () => {
        const f = ocrFile.files[0];
        if (!f) return;
        if (f.size > 4 * 1024 * 1024) return showResult(false, 'Картинка слишком большая (макс 4 МБ)');
        const hint = document.getElementById('ocrHint');
        hint.textContent = '⏳ Распознаю текст на картинке...';
        try {
          const fd = new FormData();
          fd.append('file', f);
          fd.append('apikey', 'helloworld');
          fd.append('language', 'auto');
          fd.append('isOverlayRequired', 'false');
          fd.append('scale', 'true');
          const r = await fetch('https://api.ocr.space/parse/image', { method: 'POST', body: fd });
          const j = await r.json();
          const text = (j.ParsedResults || []).map(p => p.ParsedText).join('\n').trim();
          if (!text) { hint.textContent = 'Текст не распознан — попробуй чётче скрин'; return; }
          document.getElementById('trSrc').value = text;
          hint.textContent = '✅ Распознано ' + text.length + ' символов — перевожу...';
          const out = await translateText(text, document.getElementById('trTarget').value);
          document.getElementById('trRes').value = out || 'Не удалось перевести';
          hint.textContent = 'Готово ✅';
          showResult(true, '');
        } catch (e) {
          hint.textContent = 'Ошибка распознавания — проверь интернет';
        }
      };
    }
  </script>
</body>
</html>
