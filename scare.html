<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>😱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: pointer; user-select: none; }
    img { width: 100vw; height: 100vh; object-fit: contain; background: #000; display: block; }
  </style>
</head>
<body>
  <img id="pic" src="" alt="">
  <audio id="snd" src="moan.mp3" loop></audio>

  <script>
    const { ipcRenderer } = require('electron');
    const params = new URLSearchParams(location.search);
    const muted = params.get('muted') === '1';
    const pic = document.getElementById('pic');
    const snd = document.getElementById('snd');
    snd.volume = 1.0;

    const tryPlay = () => { if (!muted) snd.play().catch(() => {}); };
    if (params.get('img')) pic.src = params.get('img');
    tryPlay();
    setTimeout(tryPlay, 150);
    document.body.addEventListener('click', tryPlay, { once: true });

    ipcRenderer.on('scare-data', (e, p) => {
      if (p && p.dataUrl) pic.src = p.dataUrl;
      else if (p && p.img) pic.src = p.img;
      tryPlay();
    });

    const close = () => ipcRenderer.send('close-scare');
    document.body.addEventListener('click', close);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    setTimeout(close, 15000); // само закроется через 15 сек, чтобы не висело вечно
  </script>
</body>
</html>
