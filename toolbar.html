<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ебобия</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font-family: 'Segoe UI', Arial, sans-serif; }

    .pet {
      position: relative; width: 100%; height: 100%;
      -webkit-app-region: drag;
    }
    .avatar {
      position: absolute; left: 50%; top: 50%;
      width: 64px; height: 64px; border-radius: 50%;
      margin: -32px 0 0 -32px;
      border: 2px solid #ffc107;
      box-shadow: 0 0 14px rgba(255, 193, 7, 0.55);
      background: #1e1e2f;
      cursor: pointer; -webkit-app-region: no-drag;
      animation: bob 3s ease-in-out infinite;
      z-index: 10;
    }
    @keyframes bob {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: translateY(-4px) rotate(3deg); }
    }
    .avatar.wiggle { animation: wiggle 0.5s ease; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-14deg) scale(1.12); }
      75% { transform: rotate(14deg) scale(1.12); }
    }
    .pname {
      position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
      font-size: 10px; font-weight: bold; color: #ffc107;
      text-shadow: 0 1px 3px #000; letter-spacing: 0.5px; z-index: 10;
      pointer-events: none;
    }

    /* круговое меню */
    .orb {
      position: absolute; left: 50%; top: 50%;
      width: 46px; height: 46px; margin: -23px 0 0 -23px;
      border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
      font-size: 21px; cursor: pointer; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(0);
      transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), opacity 0.18s;
      -webkit-app-region: no-drag;
    }
    .open .orb { opacity: 1; transform: rotate(var(--a)) translate(0, -82px) rotate(calc(-1 * var(--a))); }
    .open .orb:hover { filter: brightness(1.2); box-shadow: 0 0 12px rgba(255,255,255,0.5); }
    .o1 { --a: -90deg; background: #dc3545; transition-delay: 0.00s; }
    .o2 { --a: -18deg; background: #0d6efd; transition-delay: 0.03s; }
    .o3 { --a:  54deg; background: #198754; transition-delay: 0.06s; }
    .o4 { --a: 126deg; background: #fd7e14; transition-delay: 0.09s; }
    .o5 { --a: 198deg; background: #6f42c1; transition-delay: 0.12s; }
  </style>
</head>
<body>
  <div class="pet" id="pet">
    <button class="orb o1" data-mode="call"       title="🆘 Заколить">🆘</button>
    <button class="orb o2" data-mode="log"        title="📝 Добавить лог">📝</button>
    <button class="orb o3" data-mode="leave"      title="🏖 Отпроситься">🏖️</button>
    <button class="orb o4" data-mode="question"   title="❓ Вопрос тиму">❓</button>
    <button class="orb o5" data-mode="translator" title="🌐 Переводчик (текст и фото)">🌐</button>

    <img src="obii-head.png" class="avatar" id="avatar" title="Ебобия — жми, чтобы открыть меню">
    <div class="pname">Ебобия</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const pet = document.getElementById('pet');

    document.getElementById('avatar').addEventListener('click', () => {
      const av = document.getElementById('avatar');
      av.classList.remove('wiggle'); void av.offsetWidth; av.classList.add('wiggle');
      pet.classList.toggle('open');
    });

    document.querySelectorAll('.orb').forEach(btn => {
      btn.addEventListener('click', () => {
        ipcRenderer.send('open-quick', btn.dataset.mode);
        pet.classList.remove('open');
      });
    });
  </script>
</body>
</html>
